name: Offline Lua policy tests

on:
  push:
    branches:
      - research/auto-open-target-policy
      - research/auto-open-events
      - research/multi-action-observer
      - research/world-owner-handoff
      - research/world-renderer-reuse
      - research/automatic-world-session
      - research/auto-world-residency-latency
      - research/event-correlation-probe
      - research/show-tip-event-observer-01
      - research/committed-owner-correlation-01
      - research/selected-owner-world-01
    paths:
      - 'tests/**'
      - 'research/interaction-prompts-owner/world-space/auto-target/**'
      - 'research/interaction-prompts-owner/world-space/multi-action/**'
      - 'research/interaction-prompts-owner/world-space/owner-handoff/**'
      - 'research/interaction-prompts-owner/world-space/world-reuse/**'
      - 'research/interaction-prompts-owner/world-space/auto-world/**'
      - 'research/interaction-prompts-owner/world-space/auto-world-successor/**'
      - 'research/interaction-prompts-owner/world-space/event-driven/**'
      - 'research/interaction-prompts-owner/world-space/show-tip-event-observer/**'
      - 'research/interaction-prompts-owner/world-space/committed-owner-observer/**'
      - 'research/interaction-prompts-owner/world-space/selected-owner-world/**'
      - '.github/workflows/offline-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-target-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependency
        run: python -m pip install -r requirements-test.txt
      - name: Run repository offline tests
        run: python tools/test.py
